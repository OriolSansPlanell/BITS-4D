<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#546e7a"/>
    </marker>
  </defs>
  <g text-anchor="middle">
    <rect x="10" y="40" width="150" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="85" y="68" fill="#0d47a1">Paired TIFF stacks</text>
    <text x="85" y="88" fill="#0d47a1">neutron + X-ray</text>

    <rect x="185" y="40" width="150" height="70" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="260" y="68" fill="#1b5e20">2-D histogram</text>
    <text x="260" y="88" fill="#1b5e20">(neutron, X-ray)</text>

    <rect x="360" y="40" width="150" height="70" rx="8" fill="#fff3e0" stroke="#f57c00"/>
    <text x="435" y="68" fill="#e65100">ROI selection</text>
    <text x="435" y="88" fill="#e65100">rect / polygon / auto</text>

    <rect x="535" y="40" width="150" height="70" rx="8" fill="#fce4ec" stroke="#c2185b"/>
    <text x="610" y="68" fill="#880e4f">Segmentation</text>
    <text x="610" y="88" fill="#880e4f">masks per class</text>

    <rect x="710" y="40" width="140" height="70" rx="8" fill="#ede7f6" stroke="#512da8"/>
    <text x="780" y="61" fill="#311b92">RF prediction</text>
    <text x="780" y="81" fill="#311b92">all timepoints</text>
    <text x="780" y="101" fill="#311b92">+ export</text>
  </g>
  <g stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="160" y1="75" x2="183" y2="75"/>
    <line x1="335" y1="75" x2="358" y2="75"/>
    <line x1="510" y1="75" x2="533" y2="75"/>
    <line x1="685" y1="75" x2="708" y2="75"/>
  </g>
</svg>
